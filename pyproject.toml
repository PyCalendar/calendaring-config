[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "calendaring-config"
dynamic = ["version"]
description = "The shared configuration file of caldav, calendaring and calendaring-jmap: format, discovery and credentials"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later OR Apache-2.0"
license-files = ["COPYING.*"]
authors = [{ name = "Tobias Brox", email = "tobias@redpill-linpro.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# password_keyring: looks secrets up in the system keyring
keyring = ["keyring>=25"]
# ruff and mypy are pinned exactly; keep ruff in step with .pre-commit-config.yaml
dev = [
  "pytest>=8.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "types-PyYAML",
  "keyring>=25",
  "pre-commit>=4.0",
  "towncrier>=25.8",
]

[project.urls]
Repository = "https://github.com/pycalendar/calendaring-config"
Issues = "https://github.com/pycalendar/calendaring-config/issues"
Changelog = "https://github.com/pycalendar/calendaring-config/blob/main/docs/changelog.rst"

[tool.hatch.version]
source = "vcs"
# Only v<digit>* tags are releases. The default describe matches any tag
# containing a digit, so a date-stamped local tag on HEAD (a pre-rewrite
# backup, say) became the version and broke every build.
raw-options = { scm = { git = { describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*" } } }

[tool.hatch.build.hooks.vcs]
version-file = "src/calendaring_config/_version.py"

[tool.hatch.build.targets.sdist]
# tmp-* are the author's untracked scratch notes and must never be shipped.
exclude = ["/.github", "/.claude", "tmp-*", "*~", "*.bak"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["calendaring_config"]

[tool.mypy]
# The package ships py.typed and says Typing :: Typed, so CI checks it.
strict = true
# Check as the oldest supported Python, like ruff's target-version
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Treat warnings as errors - tests should run clean
filterwarnings = ["error"]
norecursedirs = ["docs", "build"]

[tool.towncrier]
# Same layout as calendaring and calendaring-jmap.
directory = "news/"
filename = "docs/changelog.rst"
issue_format = "`#{issue} <https://github.com/pycalendar/calendaring-config/issues/{issue}>`_"
start_string = ".. towncrier release notes start\n"
title_format = "{version} ({project_date})"
underlines = ["-", "~", "`"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals and deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "deps"
name = "Dependency changes"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal changes"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = "Other tasks"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security fixes"
showcontent = true
